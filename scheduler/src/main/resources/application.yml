server:
  port: ${SCHEDULER_PORT:8084}

spring:
  application:
    name: scheduler

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true

app:
  task-service:
    url: ${TASK_SERVICE_URL:http://localhost:8082}
  internal:
    api-key: ${INTERNAL_API_KEY:SECRET}
  report:
    topic: ${REPORT_TOPIC:report-events}
    cron: ${REPORT_CRON:*/30 * * * * *}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    root: INFO
    ru.pancomanco.scheduler: ${LOG_APP:INFO}