server:
  port: ${SCHEDULER_PORT:8084}

spring:
  application:
    name: scheduler

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true

app:
  task-service:
    url: ${TASK_SERVICE_URL:http://localhost:8082}
  internal:
    api-key: ${INTERNAL_API_KEY:SECRET}
  report:
    topic: ${REPORT_TOPIC:report-events}
    cron: ${REPORT_CRON:*/5 * * * * *}

management:
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  level:
    root: WARN
    ru.pancomanco.scheduler: ${LOG_APP:INFO}
    io.github.resilience4j: ${LOG_RESILIENCE:WARN}
    io.github.resilience4j.circuitbreaker: ${LOG_CIRCUIT_BREAKER:WARN}
    io.github.resilience4j.retry: ${LOG_RETRY:WARN}
    org.apache.kafka: ${LOG_KAFKA:WARN}
    org.springframework.scheduling: ${LOG_SCHEDULING:INFO}

resilience4j:
  circuitbreaker:
    instances:
      taskService:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
  retry:
    instances:
      taskService:
        max-attempts: 3
        wait-duration: 2s
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException