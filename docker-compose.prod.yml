

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks: [internal]

services:

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data      # сертификаты — не удалять, иначе перевыпуск и лимиты LE
      - caddy-config:/config
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    depends_on:
      - frontend
      - api-gateway
      - auth-service
    networks: [internal]

  frontend:
    <<: *service-defaults
    image: ${DOCKERHUB_USER}/todoapp-frontend:${TAG:-latest}
    container_name: frontend


  api-gateway:
    <<: *service-defaults
    image: ${DOCKERHUB_USER}/todoapp-api-gateway:${TAG:-latest}
    container_name: api-gateway
    depends_on:
      auth-service:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      TASK_SERVICE_URL: http://task-service:8082
      REDIS_HOST: redis
      JWT_ISSUER: ${JWT_ISSUER}
      FRONTEND_ORIGIN: https://${DOMAIN}
      HEALTH_DETAILS: never
    mem_limit: 400m

  auth-service:
    <<: *service-defaults
    image: ${DOCKERHUB_USER}/todoapp-auth-service:${TAG:-latest}
    container_name: auth-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      AUTH_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${AUTH_DB_NAME}
      AUTH_DATASOURCE_USERNAME: ${AUTH_DB_USER}
      AUTH_DATASOURCE_PASSWORD: ${AUTH_DB_PASSWORD}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RSA_PRIVATE_KEY_BASE64: ${RSA_PRIVATE_KEY_BASE64}
      RSA_PUBLIC_KEY_BASE64: ${RSA_PUBLIC_KEY_BASE64}
      JWT_ISSUER: ${JWT_ISSUER}

      COOKIE_SECURE: "true"
      COOKIE_SAME_SITE: Lax

      FRONTEND_ORIGIN: https://${DOMAIN}
      OAUTH_SUCCESS_REDIRECT_URI: https://${DOMAIN}/oauth-success
      OAUTH_FAILURE_REDIRECT_URI: https://${DOMAIN}/?oauthError=true

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}

      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_SMTP_AUTH: "true"
      MAIL_STARTTLS_ENABLE: "true"
      MAIL_STARTTLS_REQUIRED: "true"
      HEALTH_DETAILS: never
    mem_limit: 500m

  task-service:
    <<: *service-defaults
    image: ${DOCKERHUB_USER}/todoapp-task-service:${TAG:-latest}
    container_name: task-service
    depends_on:
      task-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    environment:
      TASK_DATASOURCE_URL: jdbc:postgresql://task-postgres:5432/${TASK_DB_NAME}
      TASK_DATASOURCE_USERNAME: ${TASK_DB_USER}
      TASK_DATASOURCE_PASSWORD: ${TASK_DB_PASSWORD}
      REDIS_HOST: redis
      AUTH_SERVICE_URL: http://auth-service:8081
      JWT_ISSUER: ${JWT_ISSUER}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      HEALTH_DETAILS: never
    mem_limit: 450m

  email-sender:
    <<: *service-defaults
    image: ${DOCKERHUB_USER}/todoapp-email-sender:${TAG:-latest}
    container_name: email-sender
    depends_on:
      email-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      EMAIL_DATASOURCE_URL: jdbc:postgresql://email-postgres:5432/${EMAIL_DB_NAME}
      EMAIL_DATASOURCE_USERNAME: ${EMAIL_DB_USER}
      EMAIL_DATASOURCE_PASSWORD: ${EMAIL_DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_SMTP_AUTH: "true"
      MAIL_STARTTLS_ENABLE: "true"
      HEALTH_DETAILS: never
    mem_limit: 400m

  scheduler:
    <<: *service-defaults
    image: ${DOCKERHUB_USER}/todoapp-scheduler:${TAG:-latest}
    container_name: scheduler
    depends_on:
      kafka:
        condition: service_healthy
      task-service:
        condition: service_started
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TASK_SERVICE_URL: http://task-service:8082
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      REPORT_TOPIC: report-events
      REPORT_CRON: ${REPORT_CRON:-0 0 0 * * *}
      HEALTH_DETAILS: never
    mem_limit: 350m



  postgres:
    <<: *service-defaults
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
      POSTGRES_DB: ${AUTH_DB_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER} -d ${AUTH_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  task-postgres:
    <<: *service-defaults
    image: postgres:16-alpine
    container_name: task-postgres
    environment:
      POSTGRES_USER: ${TASK_DB_USER}
      POSTGRES_PASSWORD: ${TASK_DB_PASSWORD}
      POSTGRES_DB: ${TASK_DB_NAME}
    volumes:
      - task-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TASK_DB_USER} -d ${TASK_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  email-postgres:
    <<: *service-defaults
    image: postgres:16-alpine
    container_name: email-postgres
    environment:
      POSTGRES_USER: ${EMAIL_DB_USER}
      POSTGRES_PASSWORD: ${EMAIL_DB_PASSWORD}
      POSTGRES_DB: ${EMAIL_DB_NAME}
    volumes:
      - email-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EMAIL_DB_USER} -d ${EMAIL_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    <<: *service-defaults
    image: redis:7-alpine
    container_name: redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  kafka:
    <<: *service-defaults
    image: confluentinc/cp-kafka:7.8.0
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 10
    mem_limit: 800m


  prometheus:
    <<: *service-defaults
    image: prom/prometheus:latest
    container_name: prometheus
    profiles: [monitoring]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    mem_limit: 300m

  grafana:
    <<: *service-defaults
    image: grafana/grafana:latest
    container_name: grafana
    profiles: [monitoring]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    mem_limit: 300m

networks:
  internal:
    driver: bridge

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  task-postgres-data:
  email-postgres-data:
  redis-data:
  kafka-data:
  prometheus-data:
  grafana-data:
