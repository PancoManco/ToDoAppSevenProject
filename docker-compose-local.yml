services:
  auth-postgres:
    image: postgres:16-alpine
    container_name: auth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AUTH_DB_USER:-authuser}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-authpass}
      POSTGRES_DB: ${AUTH_DB_NAME:-auth_db}
    ports:
      - "5432:5432"
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL","pg_isready -U ${AUTH_DB_USER:-authuser} -d ${AUTH_DB_NAME:-auth_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  task-postgres:
    image: postgres:16-alpine
    container_name: task_service_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TASK_DB_USER:-taskuser}
      POSTGRES_PASSWORD: ${TASK_DB_PASSWORD:-taskpass}
      POSTGRES_DB: ${TASK_DB_NAME:-task_db}
    ports:
      - "5433:5432"
    volumes:
      - task-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U taskuser -d task_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  email-sender-postgres:
    image: postgres:16-alpine
    container_name: email-sender-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${EMAIL_DB_USER:-emailuser}
      POSTGRES_PASSWORD: ${EMAIL_DB_PASSWORD:-emailpass}
      POSTGRES_DB: ${EMAIL_DB_NAME:-email_db}
    ports:
      - "5434:5432"
    volumes:
      - email-sender-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U emailuser -d email_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis_container
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.8.0
    container_name: kafka_container
    restart: unless-stopped
    ports:
      - "29092:29092"
    environment:
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms512M"

      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

      KAFKA_LOG_RETENTION_HOURS: 1
      KAFKA_LOG_SEGMENT_BYTES: 104857600
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list" ]
      interval: 10s
      timeout: 5s
      retries: 10

    mem_limit: 768m
    mem_reservation: 512m

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit_container
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      - MP_MAX_MESSAGES=500

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: auth-service
    restart: unless-stopped
    depends_on:
      auth-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-postgres:5432/${AUTH_DB_NAME:-auth_db}
      SPRING_DATASOURCE_USERNAME: ${AUTH_DB_USER:-authuser}
      SPRING_DATASOURCE_PASSWORD: ${AUTH_DB_PASSWORD:-authpass}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      RSA_PRIVATE_KEY_BASE64: ${RSA_PRIVATE_KEY_BASE64}
      RSA_PUBLIC_KEY_BASE64: ${RSA_PUBLIC_KEY_BASE64}
      JWT_ISSUER: toDoApplication
      FRONTEND_ORIGIN: http://localhost:5173
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}

      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m -XX:+UseG1GC -XX:MaxRAMPercentage=75.0"
    mem_limit: 512m
    mem_reservation: 256m

  task-service:
    build:
      context: .
      dockerfile: task-service/Dockerfile
    container_name: task-service
    restart: unless-stopped
    depends_on:
      task-postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://task-postgres:5432/${TASK_DB_NAME:-task_db}
      SPRING_DATASOURCE_USERNAME: ${TASK_DB_USER:-taskuser}
      SPRING_DATASOURCE_PASSWORD: ${TASK_DB_PASSWORD:-taskpass}
      AUTH_SERVICE_URL: http://auth-service:8081
      JWT_ISSUER: toDoApplication
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379

      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m -XX:+UseG1GC -XX:MaxRAMPercentage=75.0"
    mem_limit: 512m
    mem_reservation: 256m

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    depends_on:
      auth-service:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      TASK_SERVICE_URL: http://task-service:8082
      REDIS_HOST: redis
      JWT_ISSUER: toDoApplication
      FRONTEND_ORIGIN: http://localhost:5173

      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m -XX:+UseG1GC -XX:MaxRAMPercentage=75.0"
    mem_limit: 512m
    mem_reservation: 256m

  email-sender:
    build:
      context: .
      dockerfile: email-sender/Dockerfile
    container_name: email-sender
    restart: unless-stopped
    depends_on:
      email-sender-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://email-sender-postgres:5432/${EMAIL_DB_NAME:-email_db}
      SPRING_DATASOURCE_USERNAME: ${EMAIL_DB_USER:-emailuser}
      SPRING_DATASOURCE_PASSWORD: ${EMAIL_DB_PASSWORD:-emailpass}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MAIL_HOST: mailpit
      MAIL_PORT: 1025

      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m -XX:+UseG1GC -XX:MaxRAMPercentage=75.0"
    mem_limit: 512m
    mem_reservation: 256m

  scheduler:
    build:
      context: .
      dockerfile: scheduler/Dockerfile
    container_name: scheduler
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      task-service:
        condition: service_started
    ports:
      - "8084:8084"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TASK_SERVICE_URL: http://task-service:8082
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      REPORT_TOPIC: report-events
      REPORT_CRON: ${REPORT_CRON:-0 0 0 * * *}

      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m -XX:+UseG1GC -XX:MaxRAMPercentage=75.0"
    mem_limit: 512m
    mem_reservation: 256m

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8085:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: 'true'
      KAFKA_CLUSTERS_0_NAME: local-kraft
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: PLAINTEXT

      JAVA_TOOL_OPTIONS: "-Xmx128M"
    mem_limit: 256m
    mem_reservation: 128m
    profiles:
      - monitoring

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=1d'
    mem_limit: 512m
    mem_reservation: 256m
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    mem_limit: 512m
    mem_reservation: 256m
    profiles:
      - monitoring
volumes:
  auth-postgres-data:
  redis-data:
  kafka-data:
  task-postgres-data:
  email-sender-postgres-data:
  prometheus-data:
  grafana-data: