server:
  port: ${EMAIL_SENDER_PORT:8083}

spring:
  application:
    name: email-sender

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/email_db}
    username: ${SPRING_DATASOURCE_USERNAME:emailuser}
    password: ${SPRING_DATASOURCE_PASSWORD:emailpass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:email-sender}
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
    listener:
      ack-mode: manual

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:false}

app:
  mail:
    from: ${MAIL_FROM:noreply@todoapp.com}

management:
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: ${HEALTH_DETAILS:never}

logging:
  level:
    root: INFO
    ru.pancomanco.emailsender: ${LOG_APP:INFO}
    org.springframework.kafka: ${LOG_KAFKA:WARN}
    org.springframework.mail: ${LOG_MAIL:WARN}
    org.hibernate.SQL: ${LOG_SQL:WARN}
    org.hibernate.orm.jdbc.bind: ${LOG_SQL_BIND:WARN}