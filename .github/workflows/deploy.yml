name: CI/CD Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest

    outputs:
      auth-service: ${{ steps.filter.outputs.auth-service }}
      task-service: ${{ steps.filter.outputs.task-service }}
      email-sender: ${{ steps.filter.outputs.email-sender }}
      scheduler: ${{ steps.filter.outputs.scheduler }}
      api-gateway: ${{ steps.filter.outputs.api-gateway }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            auth-service:
              - 'auth-service/**'
              - 'common/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle/**'
              - 'gradlew'
              - 'gradlew.bat'

            task-service:
              - 'task-service/**'
              - 'common/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle/**'
              - 'gradlew'
              - 'gradlew.bat'

            email-sender:
              - 'email-sender/**'
              - 'common/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle/**'
              - 'gradlew'
              - 'gradlew.bat'

            scheduler:
              - 'scheduler/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle/**'
              - 'gradlew'
              - 'gradlew.bat'

            api-gateway:
              - 'api-gateway/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle/**'
              - 'gradlew'
              - 'gradlew.bat'

            frontend:
              - 'frontend/**'
              - 'docker/nginx.conf'

            infra:
              - 'docker-compose-prod.yml'
              - 'deploy.sh'
  test:
    name: Run Gradle tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: |
          chmod +x ./gradlew
          ./gradlew test --no-daemon

  build-and-push:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs:
      - test
      - detect-changes
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth-service
            changed: ${{ needs.detect-changes.outputs.auth-service }}
            dockerfile: ./auth-service/Dockerfile
          - service: task-service
            changed: ${{ needs.detect-changes.outputs.task-service }}
            dockerfile: ./task-service/Dockerfile
          - service: email-sender
            changed: ${{ needs.detect-changes.outputs.email-sender }}
            dockerfile: ./email-sender/Dockerfile
          - service: scheduler
            changed: ${{ needs.detect-changes.outputs.scheduler }}
            dockerfile: ./scheduler/Dockerfile
          - service: api-gateway
            changed: ${{ needs.detect-changes.outputs.api-gateway }}
            dockerfile: ./api-gateway/Dockerfile
          - service: frontend
            changed: ${{ needs.detect-changes.outputs.frontend }}
            dockerfile: ./frontend/Dockerfile
    steps:
      - name: Skip if not changed
        if: matrix.changed != 'true'
        run: |
            echo "⏭️ ${{ matrix.service }} не изменился — пропускаем сборку"
            exit 0

      - name: Checkout
        if: matrix.changed == 'true'
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        if: matrix.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: matrix.changed == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate Docker metadata
        if: matrix.changed == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}
          tags: |
              type=raw,value=latest
              type=sha,prefix=sha-
      - name: Build and push
        if: matrix.changed == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    needs:
      - detect-changes
      - build-and-push

    if: |
      github.ref == 'refs/heads/main' &&
      needs.build-and-push.result == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Copy deployment files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          source: docker-compose-prod.yml,deploy.sh
          target: /opt/todo-app
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          AUTH_CHANGED: ${{ needs.detect-changes.outputs.auth-service }}
          TASK_CHANGED: ${{ needs.detect-changes.outputs.task-service }}
          EMAIL_CHANGED: ${{ needs.detect-changes.outputs.email-sender }}
          SCHEDULER_CHANGED: ${{ needs.detect-changes.outputs.scheduler }}
          GATEWAY_CHANGED: ${{ needs.detect-changes.outputs.api-gateway }}
          FRONTEND_CHANGED: ${{ needs.detect-changes.outputs.frontend }}
          INFRA_CHANGED: ${{ needs.detect-changes.outputs.infra }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          envs: DOCKERHUB_USERNAME,AUTH_CHANGED,TASK_CHANGED,EMAIL_CHANGED,SCHEDULER_CHANGED,GATEWAY_CHANGED,FRONTEND_CHANGED,INFRA_CHANGED
          script: |
            set -e
            cd /opt/todo-app
            chmod +x deploy.sh
            
            # Собираем список изменённых сервисов
            SERVICES=""
            [ "$AUTH_CHANGED" = "true" ] && SERVICES="$SERVICES auth-service"
            [ "$TASK_CHANGED" = "true" ] && SERVICES="$SERVICES task-service"
            [ "$EMAIL_CHANGED" = "true" ] && SERVICES="$SERVICES email-sender"
            [ "$SCHEDULER_CHANGED" = "true" ] && SERVICES="$SERVICES scheduler"
            [ "$GATEWAY_CHANGED" = "true" ] && SERVICES="$SERVICES api-gateway"
            [ "$FRONTEND_CHANGED" = "true" ] && SERVICES="$SERVICES frontend"
            
            if [ -z "$SERVICES" ] && [ "$INFRA_CHANGED" != "true" ]; then
              echo "ℹ️  Ни один сервис не изменился — деплой не нужен"
              exit 0
            fi
            
             if [ "$INFRA_CHANGED" = "true" ] \
              && [ -z "$SERVICES" ]; then
              echo "🚀 Обновляем инфраструктуру"
              ./deploy.sh
            else
              echo "🚀 Деплоим:$SERVICES"
              ./deploy.sh $SERVICES
            fi