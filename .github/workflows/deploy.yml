name: CI/CD Deploy

on:
  push:
    branches:
      - main

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}

      api_gateway_changed: ${{ steps.check.outputs.api_gateway_changed }}
      auth_service_changed: ${{ steps.check.outputs.auth_service_changed }}
      task_service_changed: ${{ steps.check.outputs.task_service_changed }}
      email_sender_changed: ${{ steps.check.outputs.email_sender_changed }}
      scheduler_changed: ${{ steps.check.outputs.scheduler_changed }}
      frontend_changed: ${{ steps.check.outputs.frontend_changed }}

    steps:
        - name: Checkout code
          uses: actions/checkout@v5
          with:
            fetch-depth: 5

        - name: Check for changes
          id: check
          run: |
              if git merge-base ${{ github.event.before }} ${{ github.sha }} >/dev/null 2>&1; then
                CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})
              else
                CHANGED_FILES=$(git show --name-only --pretty=format: ${{ github.sha }})
              fi
              echo "changed=false" >> $GITHUB_OUTPUT
              for folder in frontend common backend scheduler mailer; do
                if echo "$CHANGED_FILES" | grep -q "^$folder/"; then
                  echo "changed=true" >> $GITHUB_OUTPUT
                  echo "${folder}_changed=true" >> $GITHUB_OUTPUT
                else
                  echo "${folder}_changed=false" >> $GITHUB_OUTPUT
                fi
              done
  test:
    name: Run Gradle tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: |
          chmod +x ./gradlew
          ./gradlew test --no-daemon

  build-and-push:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    needs: [test,check-changes]
    if: needs.check-changes.outputs.changed == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push api-gateway
        if: needs.check-changes.outputs.frontend-changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./api-gateway/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/todo-api-gateway:latest

      - name: Build and push auth-service
        if: needs.check-changes.outputs.auth_service_changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./auth-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/todo-auth-service:latest

      - name: Build and push task-service
        if: needs.check-changes.outputs.task_service_changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./task-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/todo-task-service:latest

      - name: Build and push email-sender
        if: needs.check-changes.outputs.email_sender_changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./email-sender/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/todo-email-sender:latest

      - name: Build and push scheduler
        if: needs.check-changes.outputs.scheduler_changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./scheduler/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/todo-scheduler:latest

      - name: Build and push frontend
        if: needs.check-changes.outputs.frontend_changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/todo-frontend:latest

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [build-and-push,check-changes,test]
    if: needs.check-changes.outputs.changed == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd ${{ secrets.VPS_DEPLOY_PATH }}

            docker compose --env-file .env -f docker-compose-prod.yml pull

            docker compose --env-file .env -f docker-compose-prod.yml up -d --remove-orphans

            docker image prune -f

            docker compose --env-file .env -f docker-compose-prod.yml ps