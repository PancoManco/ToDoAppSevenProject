app:
  security:
    frontend-origin: "http://localhost:5173"
    oauth2-success-redirect: "http://localhost:5173/oauth-success"
    oauth2-failure-redirect: "http://localhost:5173/login?error=oauth"

    jwt:
      issuer: "toDoApplication"
      secret: "${JWT_SECRET}"
      access-token-minutes: 15
      refresh-token-days: 7
    cookie:
      secure: false
      same-site: "Lax"

spring:
  application:
    name: toDoApplication
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  liquibase:
    enabled: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - openid
              - email
              - profile
          github:
            client-id: ${GITHUB_CLIENT_ID:}
            client-secret: ${GITHUB_CLIENT_SECRET:}
            scope:
              - read:user
              - user:email
logging:
  level:
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
