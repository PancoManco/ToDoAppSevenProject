app:
  security:
    frontend-origin: ${FRONTEND_ORIGIN}
    oauth2-success-redirect:  ${OAUTH_SUCCESS_REDIRECT_URI}
    oauth2-failure-redirect:  ${OAUTH_FAILURE_REDIRECT_URI}

    jwt:
      issuer: "toDoApplication"
      secret: ${JWT_SECRET}
      access-token-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES:5}
      refresh-token-days: ${JWT_REFRESH_TOKEN_TTL_DAYS:7}
    cookie:
      secure: false
      same-site: "Lax"
  mail:
    from: ${MAIL_FROM}
spring:
  application:
    name: toDoApplication
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    driver-class-name: ${DATASOURCE_DRIVER}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - openid
              - email
              - profile
  mail:
    host: localhost
    port: 1025
    username: ""
    password: ""
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
            required: false
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
resilience4j:
  ratelimiter:
    instances:
      authLimiter:
        limit-for-period: 5
        limit-refresh-period: 60s
        timeout-duration: 0s
        register-health-indicator: true
      defaultLimiter:
        limit-for-period: 50
        limit-refresh-period: 10s
        timeout-duration: 0s
logging:
  level:
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
