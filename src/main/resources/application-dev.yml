app:
  security:
    frontend-origin: ${FRONTEND_ORIGIN}
    oauth2-success-redirect:  ${OAUTH_SUCCESS_REDIRECT_URI}
    oauth2-failure-redirect:  ${OAUTH_FAILURE_REDIRECT_URI}

    jwt:
      issuer: "toDoApplication"
      secret: ${JWT_SECRET}
      access-token-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES:5}
      refresh-token-days: ${JWT_REFRESH_TOKEN_TTL_DAYS:7}
    cookie:
      secure: false
      same-site: "Lax"
  mail:
    from: ${MAIL_FROM}
spring:
  application:
    name: toDoApplication
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    driver-class-name: ${DATASOURCE_DRIVER}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  liquibase:
    enabled: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - openid
              - email
              - profile
          github:
            client-id: ${GITHUB_CLIENT_ID:}
            client-secret: ${GITHUB_CLIENT_SECRET:}
            scope:
              - read:user
              - user:email
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
        starttls:
          enable: true
          required: true
logging:
  level:
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
