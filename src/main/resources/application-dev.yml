app:
  security:
    cookie:
      secure: false
      same-site: Lax

spring:
  jpa:
    properties:
      hibernate:
        format_sql: true

  mail:
    host: localhost
    port: 1025
    username: ""
    password: ""
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
            required: false

  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
