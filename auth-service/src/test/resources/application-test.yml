app:
  security:
    frontend-origin: http://localhost:5173
    oauth2-success-redirect: http://localhost:5173/oauth2/success
    oauth2-failure-redirect: http://localhost:5173/oauth2/failure
    rsa:
      private-key-base64: 
      public-key-base64: 
    jwt:
      issuer: toDoApplication-test
      secret: dGVzdC1zZWNyZXQta2V5LWZvci1qd3QtdG9rZW4tYXQtbGVhc3QtMjU2LWJpdHM=
      access-token-minutes: 5
      refresh-token-days: 7
    cookie:
      secure: false
      same-site: Lax
  mail:
    from: noreply@test.local
  rate-limit:
    enabled: false

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  mail:
    host: localhost
    port: 1025
    username: ""
    password: ""
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
            required: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret

logging:
  level:
    root: WARN
    ru.pancomanco.todoappsevenproject: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN