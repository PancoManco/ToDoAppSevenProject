server:
  port: ${AUTH_SERVICE_PORT:8081}
app:
  security:
    frontend-origin: ${FRONTEND_ORIGIN}
    oauth2-success-redirect: ${OAUTH_SUCCESS_REDIRECT_URI}
    oauth2-failure-redirect: ${OAUTH_FAILURE_REDIRECT_URI}
    rsa:
      private-key-base64: ${RSA_PRIVATE_KEY_BASE64}
      public-key-base64: ${RSA_PUBLIC_KEY_BASE64}
    jwt:
      issuer: ${JWT_ISSUER:toDoApplication}
      secret: ${JWT_SECRET}
      access-token-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES:5}
      refresh-token-days: ${JWT_REFRESH_TOKEN_TTL_DAYS:7}

    cookie:
      secure: false
      same-site: ${COOKIE_SAME_SITE:Lax}

  mail:
    from: ${MAIL_FROM}

  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}

  outbox:
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:5000}
    cleanup-cron: ${OUTBOX_CLEANUP_CRON:0 0 2 * * *}

spring:
  application:
    name: toDoApplication

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    driver-class-name: ${DATASOURCE_DRIVER:org.postgresql.Driver}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - openid
              - email
              - profile

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:true}
            required: ${MAIL_STARTTLS_REQUIRED:true}

  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

  management:
    endpoints:
      web:
        exposure:
          include: health,info,metrics
    endpoint:
      health:
        probes:
          enabled: true
        show-details: never
    health:
      db:
        enabled: true
      redis:
        enabled: true
      mail:
        enabled: true

logging:
  level:
    root: INFO
    ru.pancomanco.todoappsevenproject: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN