server:
  port: ${AUTH_SERVICE_PORT:8081}
  forward-headers-strategy: framework

spring:
  application:
    name: auth-service

  datasource:
    url: ${AUTH_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${AUTH_DATASOURCE_USERNAME:postgres}
    password: ${AUTH_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL:false}

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:false}
            required: ${MAIL_STARTTLS_REQUIRED:false}

  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

app:
  security:
    frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
    oauth2-success-redirect: ${OAUTH_SUCCESS_REDIRECT_URI:http://localhost:5173}
    oauth2-failure-redirect: ${OAUTH_FAILURE_REDIRECT_URI:http://localhost:5173/login}
    rsa:
      private-key-base64: ${RSA_PRIVATE_KEY_BASE64}
      public-key-base64: ${RSA_PUBLIC_KEY_BASE64}
    jwt:
      issuer: ${JWT_ISSUER:toDoApplication}
      access-token-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES:5}
      refresh-token-days: ${JWT_REFRESH_TOKEN_TTL_DAYS:7}
    cookie:
      secure: ${COOKIE_SECURE:false}
      same-site: ${COOKIE_SAME_SITE:Lax}
  mail:
    from: ${MAIL_FROM:noreply@todoapp.com}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
  outbox:
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:5000}
    cleanup-cron: ${OUTBOX_CLEANUP_CRON:0 0 2 * * *}

management:
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: ${HEALTH_DETAILS:never}
  health:
    db:
      enabled: true
    redis:
      enabled: true
    mail:
      enabled: true

logging:
  level:
    root: INFO
    ru.pancomanco.todoappsevenproject: ${LOG_APP:INFO}
    org.springframework.security: ${LOG_SECURITY:INFO}
    org.hibernate.SQL: ${LOG_SQL:WARN}
    org.hibernate.orm.jdbc.bind: ${LOG_SQL_BIND:WARN}