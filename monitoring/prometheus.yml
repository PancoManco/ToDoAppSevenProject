global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'auth-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['auth-service:8081']

  - job_name: 'task-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['task-service:8082']

  - job_name: 'email-sender'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['email-sender:8083']

  - job_name: 'scheduler'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['scheduler:8084']

  - job_name: 'api-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['api-gateway:8080']