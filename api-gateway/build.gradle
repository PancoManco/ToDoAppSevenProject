plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'ru.pancomanco'
version = '0.0.1-SNAPSHOT'
description = 'api-gateway'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(26)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', "2025.1.2")
}

dependencies {
    // =========================
    // Spring Cloud Gateway (WebFlux-based!)
    // ========================+
    implementation("org.springframework.cloud:spring-cloud-starter-gateway:4.3.5")

    // =========================
    // Security + JWT валидация (реактивный стек)
    // =========================
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    // =========================
    // Rate Limiting (Redis reactive)
    // =========================
    implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'

    // =========================
    // Circuit Breaker (Resilience4j)
    // =========================
    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-reactor-resilience4j'

    // =========================
    // Monitoring / Actuator
    // =========================
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // =========================
    // Lombok
    // =========================
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // =========================
    // Tests
    // =========================
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'io.projectreactor:reactor-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
