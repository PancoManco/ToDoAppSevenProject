server:
  port: ${API_GATEWAY_PORT:8080}
  forward-headers-strategy: framework
app:
  cors:
    enabled: ${CORS_ENABLED:false}
    allowed-origins: ${FRONTEND_ORIGIN:http://localhost:5173}
spring:
  application:
    name: api-gateway
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  security:
    jwt:
      issuer: ${JWT_ISSUER:toDoApplication}
      jwk-set-uri: ${AUTH_SERVICE_URL:http://localhost:8081}/.well-known/jwks.json
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin, RETAIN_FIRST
          routes:
            # ========== AUTH-SERVICE ==========
            - id: auth-register
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/register
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: ${RL_REGISTER_RATE:10}
                    redis-rate-limiter.burstCapacity: ${RL_REGISTER_BURST:20}
                    key-resolver: "#{@ipKeyResolver}"

            - id: auth-login
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/login
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: ${RL_LOGIN_RATE:10}
                    redis-rate-limiter.burstCapacity: ${RL_LOGIN_BURST:20}
                    key-resolver: "#{@ipKeyResolver}"

            - id: auth-verify
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/verify-email,/api/v1/auth/resend-verification-code
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: ${RL_VERIFY_RATE:30}
                    redis-rate-limiter.burstCapacity: ${RL_VERIFY_BURST:50}
                    key-resolver: "#{@ipKeyResolver}"

            - id: auth-password
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/forgot-password,/api/v1/auth/reset-password
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: ${RL_PASSWORD_RATE:10}
                    redis-rate-limiter.burstCapacity: ${RL_PASSWORD_BURST:20}
                    key-resolver: "#{@ipKeyResolver}"

            - id: auth-refresh
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/refresh
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: ${RL_REFRESH_RATE:30}
                    redis-rate-limiter.burstCapacity: ${RL_REFRESH_BURST:50}
                    key-resolver: "#{@ipKeyResolver}"

            - id: auth-logout
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/logout

            - id: auth-public
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/.well-known/**
            - id: auth-me
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/me
            # ========== TASK-SERVICE ==========
            - id: task-service
              uri: ${TASK_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/tasks/**


management:
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics,prometheus
  endpoint:
    gateway:
      access: none
    health:
      show-details: ${HEALTH_DETAILS:always}

logging:
  level:
    root: WARN
    ru.pancomanco.apigateway: ${LOG_APP:INFO}
    org.springframework.cloud.gateway: ${LOG_GATEWAY:INFO}
    org.springframework.security: ${LOG_SECURITY:WARN}
    reactor.netty.http.client: ${LOG_NETTY:WARN}
    reactor.netty.http.server: ${LOG_NETTY:WARN}
    io.github.resilience4j: ${LOG_RESILIENCE:WARN}